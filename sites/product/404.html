		<style>

				--line: rgb(20 20 20 / 14%);

			* { box-sizing: border-box; }
			body {

				min-height: 100vh;

			.brand span { font-size: 1.5rem; font-weight: 700; letter-spacing: -.05em; }
			.kicker { font-family: var(--mono); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 1rem; }
			.kicker::before { content: ''; display: inline-block; width: 24px; height: 2px; margin-right: .6rem; background: var(--lava); vertical-align: middle; }

			p { margin: 0 0 1.5rem; max-width: 46ch; color: var(--muted); }

			a:hover { color: var(--lava); }
			.studio { margin-top: 4rem; padding-top: 1.25rem; border-top: 1px solid var(--line); }
			.studio a { display: inline-flex; align-items: center; gap: .45rem; color: var(--muted); text-decoration: none; }
			.studio img { display: block; width: auto; height: 24px; }
			.studio span { font-size: .9rem; font-weight: 600; letter-spacing: -.02em; color: var(--basalt); }
		</style>
