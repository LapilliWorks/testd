[package]
name = "testd-gui"
version = "0.1.0-alpha"
edition.workspace = true
# tauri 2.12 requires 1.90; the CLI and daemon stay at the workspace MSRV.
rust-version = "1.90"
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
open = "5"
serde_json = { workspace = true }
testd-client = { workspace = true }
testd-core = { workspace = true }
testd-daemon = { workspace = true }
# 2.12 ships tray-icon 0.25, which pops the tray menu on mouse-up. Older
# tray-icon opened it on mouse-down, so the matching mouse-up dismissed the menu
# immediately on Windows.
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tokio = { workspace = true }
tauri-plugin-deep-link = "2"
# The Linux backend still requires zbus 5 and its deprecated standalone crates:
# RUSTSEC-2026-0370, RUSTSEC-2026-0371, RUSTSEC-2026-0372: informational merger notices.
# Even current plugin releases use zbus 5; keep single-instance/deep-link behavior.
# Remove the narrow deny.toml exceptions once this and notify-rust migrate to zbus 6.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"
