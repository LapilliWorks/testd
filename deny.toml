# cargo-deny configuration. Run: cargo deny check
[advisories]
version = 2
yanked = "warn"
# Informational maintenance notices, not vulnerability advisories; see docs/dependency-policy.md.
ignore = [
	"RUSTSEC-2024-0370", # proc-macro-error: GTK3 build-time macros
	"RUSTSEC-2026-0370", # zvariant: merged into zbus 6
	"RUSTSEC-2026-0371", # zbus_names: merged into zbus 6
	"RUSTSEC-2026-0372", # zvariant_derive: merged into zbus 6
]

[licenses]
version = 2
allow = [
	"MIT",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"Unicode-3.0",
	"Zlib",
	"MPL-2.0",
	"CC0-1.0",
	"0BSD",
	"BlueOak-1.0.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
	# rustls is the only TLS stack in the product.
	{ name = "openssl" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
