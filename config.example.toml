# testd host configuration

[host]
# DNS resolution backend: "dns" (built-in DNS server) or "hosts" (/etc/hosts).
# resolver = "dns"

# Path to the hosts helper script (invoked via sudo when resolver = "hosts").
# hosts_helper_path = "/usr/local/libexec/testd-hosts-helper"

# Address the daemon listens on for client connections.
# listen_addr = "127.0.0.1:7737"

# Path to the managed Caddyfile (imported by your global Caddy config).
# caddyfile_path = "~/.config/testd/Caddyfile"

# Path to the global Caddyfile (for `caddy reload --config`).
caddy_config_path = "{caddy_config_path}"

# Local CA and host intermediate directories.
# pki_dir = "~/.config/testd/pki"

# Allow a leaf on another machine to register a target other than its own
# address. Disabled by default: an issued token is otherwise limited to the
# address the leaf connected from, not an arbitrary host or loopback service.
# allow_remote_targets = false

# Trust the X-Forwarded-For header from a configured front proxy. Leave this
# off for the built-in edge; clients can otherwise spoof their source address.
# trust_forwarded_for = false

# The operator secret: the bootstrap credential for this machine and for
# unattended clients that present it as TESTD_TOKEN. Leaves normally request
# their own token on first run and an operator approves it; those tokens live
# in tokens.json beside this file. `testd init` and the setup wizard write the
# secret here; re-running keeps the existing value.
{secret}

# Built-in HTTPS edge. Port 443 needs CAP_NET_BIND_SERVICE (or root privileges).
# edge_addr = "127.0.0.1:443"

# Disable the built-in TLS listener when another front terminates TLS. The
# plain HTTP routing listener below stays on.
# edge_enabled = true

# Plain HTTP routing for an external front and `testd export-caddyfile`. This
# listener is always on.
# http_addr = "127.0.0.1:7740"

# A-record address returned for registered names.
# answer_addr = "127.0.0.1"
