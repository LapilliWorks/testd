name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Classify the change set so documentation-only edits do not start builds.
  # The filters themselves live in scripts/ci-changes.sh.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      release: ${{ steps.filter.outputs.release }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci-changes.sh

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.release == 'true'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: macos-15
            platform: macos
          - os: macos-15-intel
            platform: macos
          - os: windows-2025
            platform: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: rustup toolchain install 1.89.0 1.90.0 --profile minimal
      - uses: ./.github/actions/linux-dependencies
        if: runner.os == 'Linux'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: oven-sh/setup-bun@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: bun install --frozen-lockfile
      - name: Run all unprivileged platform checks
        run: python scripts/test-${{ matrix.platform }}.py ci --report ci-reports
      - name: Retain status summary, never fixture state or raw reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary-${{ matrix.os }}
          path: ci-reports/ci-summary.json
          retention-days: 7
          if-no-files-found: warn

  fedora:
    name: test (fedora-44 userspace)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.release == 'true'
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      HOME: /home/testd-ci
      CARGO_HOME: /home/testd-ci/.cargo
      RUSTUP_HOME: /home/testd-ci/.rustup
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Bootstrap Fedora container
        run: |
          dnf install -y git tar gzip ca-certificates libstdc++ shadow-utils util-linux python3 curl
          useradd --create-home testd-ci
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-dependencies
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: rustup toolchain install 1.89.0 1.90.0 --profile minimal
      - uses: oven-sh/setup-bun@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-fedora-44
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: bun install --frozen-lockfile
      - name: Run Fedora userspace checks as a normal user
        run: |
          chown -R testd-ci:testd-ci "$HOME" "$GITHUB_WORKSPACE"
          runuser -u testd-ci --preserve-environment -- \
            env USER=testd-ci LOGNAME=testd-ci \
            python3 scripts/test-linux.py ci --report "$GITHUB_WORKSPACE/ci-reports"
      - name: Retain status summary, never fixture state or raw reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary-fedora-44
          path: ci-reports/ci-summary.json
          retention-days: 7
          if-no-files-found: warn

  site:
    name: site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run check:links

  system-state-fixtures:
    name: system-state fixtures (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Real resolver and trust checks require a separate disposable host with
      # a persisted full-system snapshot; hosted CI only runs fake-state tests.
      - run: python -m unittest discover -s tests/release -p test_release.py -k SystemStateTests

  bundle:
    name: bundle (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test, fedora, system-state-fixtures, site]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: ./.github/actions/linux-dependencies
        if: runner.os == 'Linux'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag or workspace candidate version
        id: version
        run: |
          version="$(python -c 'import pathlib, tomllib;
          print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"])')"
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then version="${GITHUB_REF_NAME#v}"; fi
          python scripts/release.py verify-version "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      # The CLI compiles from source on every target. Bump the cache key when
      # moving to a new Tauri major.
      - id: tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: cargo-tauri-v2-${{ runner.os }}-${{ runner.arch }}
      - if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --locked --version '^2'
      - run: cargo build --release --bin testd --locked --target ${{ matrix.target }}
      - run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Package archives and validate bundle selection without installing
        run: >-
          python scripts/release.py package --version "${{ steps.version.outputs.version }}"
          --target ${{ matrix.target }} --build-dir target/${{ matrix.target }}/release --output dist
      # Installer smoke tests require a separately backed-up, interactive VM.
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  sbom:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test, fedora, system-state-fixtures, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo install cargo-cyclonedx --locked
      - run: scripts/release-sbom.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/sbom/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bundle, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom
      - run: tar -czf dist/testd-sbom.tar.gz -C sbom .
      - name: Generate Homebrew definitions from real release bytes
        run: >-
          python scripts/release.py homebrew --version "${GITHUB_REF_NAME#v}"
          --artifacts dist --output dist
      - run: python scripts/release.py checksums dist
      - name: Attach free artifacts to a draft public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release.py release-notes "${GITHUB_REF_NAME#v}" > release-notes.md
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            flags=(--verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file release-notes.md)
            case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$GITHUB_REF_NAME" "${flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*
