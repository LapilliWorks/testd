name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      host_system:
        description: Run the privileged `host --system` suite on disposable runners
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: ./.github/actions/linux-dependencies
        if: runner.os == 'Linux'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked
      - run: python scripts/release.py verify-version
      - run: python -m unittest discover -s tests/release -p 'test_*.py'
      - run: bun test tests/release/browser.test.ts

  system-restore:
    name: system restore (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Real privileged writes and stores, no daemon and no resolver needed.
      # Runners are disposable, so the fixture is safe to install and remove.
      - run: python tests/release/system_state.py --self-test

  host-system:
    name: host --system (${{ matrix.os }})
    # Opt in per run with the workflow_dispatch input, or permanently with the
    # TESTD_CI_HOST_SYSTEM repository variable. Gated by default: the suite
    # changes the runner's resolver and trust store, and on Linux it needs
    # systemd-resolved, which the runner image does not start.
    if: >-
      github.event.inputs.host_system == 'true' || vars.TESTD_CI_HOST_SYSTEM == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/linux-dependencies
        if: runner.os == 'Linux'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # doctor --fix refuses to write the drop-in unless systemd-resolved is
      # active, and the image ships it stopped.
      - if: runner.os == 'Linux'
        run: |
          sudo systemctl unmask systemd-resolved || true
          sudo systemctl enable --now systemd-resolved
          systemctl is-active systemd-resolved
      - run: cargo build --release --bin testd --locked
      # No --service: the runner has no user session bus for `systemctl --user`.
      - if: runner.os != 'Windows'
        run: python tests/release/run.py host --system --bin target/release/testd
      - if: runner.os == 'Windows'
        run: python tests/release/run.py host --system --bin target/release/testd.exe

  msrv:
    name: msrv (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - toolchain: '1.89.0'
            packages: '--workspace --exclude testd-gui'
          - toolchain: '1.90.0'
            packages: '-p testd-gui'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: ./.github/actions/linux-dependencies
        if: matrix.toolchain == '1.90.0'
      - run: cargo check ${{ matrix.packages }} --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  bundle:
    name: bundle (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, msrv, deny]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/linux-dependencies
        if: runner.os == 'Linux'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/release.py verify-version "${GITHUB_REF_NAME#v}"
      - run: cargo build --release --bin testd --locked --target ${{ matrix.target }}
      - run: cargo install cargo-tauri --locked --version '^2'
      - run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - run: >-
          python scripts/release.py package --version "${GITHUB_REF_NAME#v}"
          --target ${{ matrix.target }} --build-dir target/${{ matrix.target }}/release --output dist
      - run: python tests/release/run.py artifacts --artifacts dist
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  sbom:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, msrv, deny]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo install cargo-cyclonedx --locked
      - run: scripts/release-sbom.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/sbom/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bundle, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom
      - run: tar -czf dist/testd-sbom.tar.gz -C sbom .
      - name: Generate Homebrew definitions from real release bytes
        run: >-
          python scripts/release.py homebrew --version "${GITHUB_REF_NAME#v}"
          --artifacts dist --output dist
      - run: python scripts/release.py checksums dist
      - name: Attach free artifacts to a draft public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release.py release-notes "${GITHUB_REF_NAME#v}" > release-notes.md
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*
