name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Classify the change set so documentation-only edits do not start builds.
  # The filters themselves live in scripts/ci-changes.sh.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      release: ${{ steps.filter.outputs.release }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci-changes.sh

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: ./.github/actions/linux-dependencies
        if: runner.os == 'Linux'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked
      - name: Stable-release contract gate
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        run: cargo nextest run --workspace --locked --run-ignored all
      - run: python scripts/release.py verify-version
      - run: python -m unittest discover -s tests/release -p 'test_*.py'
      - run: >-
          python -c "import pathlib, subprocess;
          subprocess.run(['bun', 'test', str(pathlib.Path('tests/release/browser.test.ts').resolve())],
          check=True, timeout=300)"

  site:
    name: site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run check:links

  system-state-fixtures:
    name: system-state fixtures (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Real resolver and trust checks require a separate disposable host with
      # a persisted full-system snapshot; hosted CI only runs fake-state tests.
      - run: python -m unittest discover -s tests/release -p test_release.py -k SystemStateTests

  msrv:
    name: msrv (${{ matrix.toolchain }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - toolchain: '1.89.0'
            packages: '--workspace --exclude testd-gui'
          - toolchain: '1.90.0'
            packages: '-p testd-gui'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: ./.github/actions/linux-dependencies
        if: matrix.toolchain == '1.90.0'
      - run: cargo check ${{ matrix.packages }} --locked

  deny:
    name: cargo-deny
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  bundle:
    name: bundle (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, msrv, deny]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: ./.github/actions/linux-dependencies
        if: runner.os == 'Linux'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/release.py verify-version "${GITHUB_REF_NAME#v}"
      # The CLI compiles from source on every target. Bump the cache key when
      # moving to a new Tauri major.
      - id: tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-cli*
          key: tauri-cli-v2-${{ runner.os }}-${{ runner.arch }}
      - if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --locked --version '^2'
      - run: cargo build --release --bin testd --locked --target ${{ matrix.target }}
      - run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - run: >-
          python scripts/release.py package --version "${GITHUB_REF_NAME#v}"
          --target ${{ matrix.target }} --build-dir target/${{ matrix.target }}/release --output dist
      - run: python tests/release/run.py artifacts --artifacts dist
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  sbom:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, msrv, deny]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo install cargo-cyclonedx --locked
      - run: scripts/release-sbom.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/sbom/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bundle, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom
      - run: tar -czf dist/testd-sbom.tar.gz -C sbom .
      - name: Generate Homebrew definitions from real release bytes
        run: >-
          python scripts/release.py homebrew --version "${GITHUB_REF_NAME#v}"
          --artifacts dist --output dist
      - run: python scripts/release.py checksums dist
      - name: Attach free artifacts to a draft public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release.py release-notes "${GITHUB_REF_NAME#v}" > release-notes.md
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            flags=(--verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file release-notes.md)
            case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$GITHUB_REF_NAME" "${flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*
