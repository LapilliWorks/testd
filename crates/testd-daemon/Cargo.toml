# Its zbus 5 backend includes deprecated zvariant/zbus_names/zvariant_derive:
# RUSTSEC-2026-0370, RUSTSEC-2026-0371, RUSTSEC-2026-0372: informational merger notices.
# deny.toml narrowly exempts these IDs; remove the exceptions when this uses zbus 6.
notify-rust = "4.18"

