[workspace]
members = ["crates/testd-core"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "ISC"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "signal", "process", "time", "sync"] }
toml = "1"
getrandom = "0.3"
covo = "0.1"

[package]
name = "testd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local dev domain manager"

[[bin]]
name = "testd"
path = "src/main.rs"
