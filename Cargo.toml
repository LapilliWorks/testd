[workspace]
members = ["crates/testd-core", "crates/testd-pki", "crates/testd-setup"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "ISC"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "signal", "process", "time", "sync"] }
toml = "1"
testd-core = { path = "crates/testd-core", version = "0.1.0" }
getrandom = "0.3"
covo = "0.1"
anyhow = "1"
base64 = "0.22"
bytes = "1"
fs2 = "0.4"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
futures-util = "0.3"
tempfile = "3"

[package]
name = "testd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local dev domain manager"

[[bin]]
name = "testd"
path = "src/main.rs"
